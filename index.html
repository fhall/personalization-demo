<!DOCTYPE html>
<!--
  Hall Energy personalisation — stand-alone demo
  Version: 2.4.0 (policy, outbound-flöde & kanaler)
  Single file · no server · no dependencies · no network calls
  Previous releases archived in versions/
-->
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hall Energy Personalisering – stand-alone demo</title>
<style>
  :root {
    --red: #EA1B0A;
    --red-dark: #C1003A;
    --ink: #1A1A1A;
    --muted: #8A8A8A;
    --rail: 420px;
    --dev: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1A1A1A;
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }

  /* ── Site shell ─────────────────────────────────────────────────────── */
  .site { min-width: 0; }
  @media (min-width: 1024px) {
    .site { padding-right: var(--rail); }
  }

  .site-header { position: sticky; top: 0; z-index: 40; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .utility { background: #F0F0F0; border-bottom: 1px solid #E5E5E5; }
  .utility-inner { max-width: 72rem; margin: 0 auto; padding: 0 16px; height: 32px; display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
  .utility a { font-size: 12px; color: #555; text-decoration: none; }
  .utility a:hover { color: var(--red); }
  .nav-inner { max-width: 72rem; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; }
  .logo { font-weight: 900; font-size: 22px; letter-spacing: -.6px; color: var(--red); text-decoration: none; margin-right: 20px; }
  .main-nav { display: flex; gap: 4px; flex: 1; }
  .main-nav a { font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 8px; text-decoration: none; }
  .main-nav a:hover, .main-nav a.active { background: #F3F4F6; }
  .login-btn { border: 0; border-radius: 999px; background: var(--red); color: #fff; font-size: 13px; font-weight: 600; padding: 9px 18px; }
  .login-btn.ghost { background: #fff; color: var(--ink); border: 1px solid #E5E7EB; }
  .bell { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E5E5E5; background: #fff; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .bell:hover { background: #F9FAFB; }
  .bell-badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .notif-bar { background: #EFF6FF; border-bottom: 1px solid #BFDBFE; color: #1E3A8A; }
  .notif-inner { max-width: 72rem; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .notif-inner .sp { flex: 1; }
  .notif-inner button { border: 0; background: none; color: #1D4ED8; font-weight: 700; font-size: 12px; }
  .inbox-card { background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; padding: 18px 20px; display: flex; gap: 14px; }
  .inbox-card.warn { border-color: #FCA5A5; }
  .inbox-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .inbox-cat { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-bottom: 5px; }
  .inbox-card h3 { margin: 0 0 4px; font-size: 15px; }
  .inbox-card p { margin: 0; font-size: 13px; color: #4B5563; line-height: 1.55; }
  .detail-grid { display: flex; gap: 22px; flex-wrap: wrap; background: #F9FAFB; border: 1px solid #F3F4F6; border-radius: 10px; padding: 10px 14px; margin: 10px 0 12px; }
  .detail-grid b { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #9CA3AF; margin-bottom: 2px; }
  .detail-grid span { font-size: 12.5px; color: #374151; font-weight: 600; }
  .inbox-cta { border: 0; border-radius: 999px; background: var(--red); color: #fff; font-weight: 600; font-size: 12px; padding: 8px 15px; }
  .inbox-meta { font-size: 11px; color: #9CA3AF; margin-top: 8px; }
  .outage-details { background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px 14px; font-size: 12px; min-width: 230px; }
  .outage-details p { margin: 0 0 3px; color: rgba(255,255,255,.92); }
  .outage-details p b { color: #fff; }
  .outage-details button { margin-top: 6px; border: 0; background: none; color: #fff; text-decoration: underline; font-weight: 600; font-size: 12px; padding: 0; }
  .user-pill { font-size: 12px; color: #555; }

  .page { max-width: 72rem; margin: 0 auto; padding: 0 16px; }
  .hero { background: linear-gradient(135deg, #EA1B0A 0%, #C1003A 55%, #8B0060 100%); padding: 56px 0 64px; }
  .hero .page { max-width: 60rem; }
  .hero h1 { color: #fff; font-size: 44px; line-height: 1.1; margin: 0 0 14px; letter-spacing: -1px; }
  .hero p.lead { color: rgba(255,255,255,.72); font-size: 18px; max-width: 640px; margin: 0 0 24px; line-height: 1.5; }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 14px; }
  .btn-white { background: #fff; color: var(--red); }
  .btn-dark { background: var(--ink); color: #fff; }
  .btn-red { background: var(--red); color: #fff; }

  .offer-card { background: #1A1A1A; border-radius: 18px; overflow: hidden; color: #fff; }
  .offer-card .kicker { padding: 18px 32px 0; display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.5); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .offer-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .offer-card .body { padding: 18px 32px 32px; }
  .offer-card h2 { margin: 0 0 14px; font-size: 30px; line-height: 1.2; }
  .offer-card p { margin: 0 0 20px; color: rgba(255,255,255,.65); line-height: 1.6; max-width: 640px; }
  .offer-chip { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(234,27,10,.12); border: 1px solid rgba(234,27,10,.3); border-radius: 10px; padding: 9px 14px; margin-bottom: 20px; font-size: 12px; }
  .offer-chip .lbl { color: var(--red); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .offer-chip .val { color: rgba(255,255,255,.6); }
  .why { margin-top: 18px; }
  .why button { background: none; border: 0; color: rgba(255,255,255,.4); font-size: 12px; padding: 0; }
  .why .explain { margin-top: 8px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 12px; font-size: 12px; color: rgba(255,255,255,.65); line-height: 1.6; }
  .action-box { margin-top: 18px; display: flex; gap: 14px; align-items: flex-start; border-radius: 12px; padding: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }
  .action-box.outage { background: rgba(234,27,10,.12); border-color: rgba(234,27,10,.4); }
  .action-box .icon { font-size: 20px; }
  .action-box .kicker { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 4px; }
  .action-box.outage .kicker { color: var(--red); }
  .action-box h3 { margin: 0 0 4px; font-size: 14px; color: #fff; }
  .action-box p { margin: 0 0 12px; font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.5; }
  .action-box button { border: 0; border-radius: 999px; background: rgba(255,255,255,.15); color: #fff; font-size: 12px; font-weight: 600; padding: 8px 14px; }
  .action-box.outage button { background: var(--red); }

  .section { padding: 56px 0; }
  .section.alt { background: #F7F7F7; }
  .section h2 { margin: 0 0 8px; font-size: 30px; }
  .section p.sub { margin: 0 0 28px; color: #6B7280; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
  .card { position: relative; background: #fff; border: 1px solid #E5E7EB; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .card .price { font-size: 13px; color: #6B7280; margin-bottom: 12px; }
  .card ul { margin: 0 0 18px; padding-left: 18px; color: #4B5563; font-size: 13px; line-height: 1.8; }
  .card .cta { margin-top: auto; }
  .card .cta button { width: 100%; border: 1px solid #E5E7EB; background: #fff; border-radius: 10px; padding: 10px; font-weight: 600; font-size: 13px; }
  .card.nbo { border-color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
  .nbo-badge { position: absolute; top: -12px; left: 16px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .card .badge { display: inline-block; background: #FFF1E8; color: #B45309; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-bottom: 10px; align-self: flex-start; }

  .matrix-wrap { overflow-x: auto; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  table.matrix { width: 100%; min-width: 620px; border-collapse: collapse; background: #fff; }
  .matrix th { background: #1A1A1A; color: #fff; font-size: 14px; font-weight: 700; padding: 16px 20px; text-align: center; position: relative; }
  .matrix th.fn { text-align: left; color: rgba(255,255,255,.45); font-weight: 500; width: 180px; }
  .matrix th .hl { display: block; color: var(--red); font-size: 11px; font-weight: 600; margin-top: 2px; }
  .matrix th.nbo::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--red); pointer-events: none; }
  .matrix th .badge { display: inline-block; margin-top: 6px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .matrix td { padding: 14px 20px; font-size: 13px; text-align: center; border-bottom: 1px solid #F3F4F6; color: #374151; }
  .matrix td.fn { text-align: left; font-weight: 600; color: #4B5563; }
  .matrix tr:nth-child(even) td { background: #FAFAFA; }
  .matrix tr:last-child td { border-bottom: 0; }

  .inbox-list { display: flex; flex-direction: column; gap: 12px; }
  .inbox-item { background: #fff; border: 1px solid #E5E7EB; border-left: 3px solid var(--red); border-radius: 12px; padding: 16px 18px; }
  .inbox-item h3 { margin: 0 0 4px; font-size: 14px; }
  .inbox-item p { margin: 0; font-size: 13px; color: #4B5563; line-height: 1.55; }
  .inbox-item .meta { font-size: 11px; color: #9CA3AF; margin-top: 8px; }

  .feature-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; text-align: center; }
  .feature-strip .icon { font-size: 32px; margin-bottom: 8px; }
  .feature-strip h3 { margin: 0 0 4px; font-size: 15px; }
  .feature-strip p { margin: 0; font-size: 13px; color: #6B7280; }

  .outage-banner { background: linear-gradient(135deg, #C1003A 0%, #EA1B0A 100%); color: #fff; padding: 16px; position: relative; z-index: 30; }
  .outage-banner .page { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .outage-banner strong { display: block; font-size: 14px; }
  .outage-banner span { font-size: 12px; color: rgba(255,255,255,.75); }
  .outage-banner button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; }
  .outage-anon { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; max-width: 360px; }
  .outage-why { font-size: 11.5px; color: rgba(255,255,255,.85); }
  .outage-why summary { cursor: pointer; font-weight: 600; color: #fff; list-style: none; }
  .outage-why summary::-webkit-details-marker { display: none; }
  .outage-why summary::before { content: 'ⓘ '; }
  .outage-why p { margin: 6px 0 0; line-height: 1.5; color: rgba(255,255,255,.82); }

  .site-footer { background: #1A1A1A; color: rgba(255,255,255,.45); padding: 40px 0 150px; }
  .site-footer .logo { color: var(--red); font-size: 18px; }

  /* ── Channel rail ───────────────────────────────────────────────────── */
  .rail {
    background: #F7F7F7;
    border-left: 1px solid #D9D9D9;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  @media (min-width: 1024px) {
    .rail { position: fixed; top: 0; right: 0; width: var(--rail); height: var(--dev); z-index: 50; }
  }
  @media (max-width: 1023px) {
    .rail { border-top: 1px solid #D9D9D9; border-left: 0; }
  }
  .rail-head { background: #fff; border-bottom: 2px solid var(--red); padding: 14px 20px; flex-shrink: 0; }
  .rail-head .kicker { color: var(--red); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin: 0; }
  .rail-head h2 { margin: 4px 0 0; font-size: 16px; line-height: 1.2; }
  .rail-head p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .rail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px; }
  .rail-intro { margin: 0 0 10px; padding: 0 4px; font-size: 11px; color: #6B7280; }
  .rail-empty { text-align: center; padding: 40px 20px; color: #9CA3AF; }
  .rail-empty .icon { font-size: 28px; margin-bottom: 8px; }
  .rail-empty p { font-size: 12px; line-height: 1.6; margin: 0; }
  .divider { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid rgba(0,0,0,.12); }
  .panel { border-radius: 14px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 2px solid; }
  .panel-head .pic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .panel-head .t { flex: 1; min-width: 0; }
  .panel-head .t b { display: block; font-size: 13px; line-height: 1.15; }
  .panel-head .t span { display: block; font-size: 10px; }
  .panel-head .count { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .panel-body { padding: 4px 14px; }
  .panel-body.none { padding: 16px 14px; text-align: center; font-size: 11px; }
  .sms-row { padding: 12px 0; display: flex; }
  .sms-bubble { background: #1E293B; color: #E2E8F0; max-width: 88%; border-radius: 14px 14px 14px 3px; padding: 9px 13px; font-size: 13px; line-height: 1.45; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .sms-bubble .meta { display: block; text-align: right; font-size: 10px; color: rgba(255,255,255,.4); margin-top: 4px; }
  .msg { padding: 10px 0; }
  .msg + .msg { border-top: 1px solid rgba(0,0,0,.07); }
  .msg .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .msg .top b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .top span { font-size: 10px; color: #9CA3AF; white-space: nowrap; }
  .msg p { margin: 2px 0 0; font-size: 12.5px; line-height: 1.45; }
  .msg .meta { font-size: 10px; color: #9CA3AF; margin-top: 4px; }

  /* ── Dev tools ──────────────────────────────────────────────────────── */
  .devtools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; }
  .scenario-bar {
    position: absolute; left: 0; right: 0; bottom: 100%;
    background: #12234A; color: #DCE6FF;
    padding: 8px 16px 10px;
    font-size: 12px;
  }
  .scenario-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .scenario-chip { background: var(--red); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; }
  .pill { border: 1px solid rgba(143,179,255,.4); background: rgba(143,179,255,.08); color: #DCE6FF; border-radius: 999px; padding: 4px 12px; font-size: 12px; }
  .pill:hover { background: rgba(255,255,255,.15); }
  .scen-title { color: #ff6a5e; font-weight: 700; }
  .step-btn { background: var(--red); color: #fff; border: 0; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
  .ghost-btn { background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); border: 0; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  .icon-btn { background: none; border: 0; color: rgba(255,255,255,.5); font-size: 14px; }
  .scenario-notes { margin: 8px 0 0; font-size: 15px; color: rgba(226,236,255,.84); line-height: 1.65; }
  .scenario-notes .check { color: #4ADE80; font-weight: 700; }

  .persona-bar { background: #0F0F0F; color: #fff; padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .persona-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .persona-chip { background: var(--red); border: 0; color: #fff; border-radius: 999px; font-weight: 700; font-size: 13px; padding: 6px 14px; }
  .persona-name { font-size: 13px; font-weight: 700; }
  .persona-meta { font-size: 11px; color: rgba(255,255,255,.45); }
  .login-pill { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 700; }
  .login-pill.on { background: #EA1B0A; color: #fff; }
  .login-pill.off { background: rgba(255,255,255,.14); color: #fff; }
  .spacer { flex: 1; }
  .toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,.6); }
  .toggle { width: 34px; height: 18px; border-radius: 999px; background: #EA1B0A; position: relative; border: 0; }
  .toggle::after { content: ""; position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .toggle.off { background: rgba(255,255,255,.25); }
  .toggle.off::after { right: auto; left: 2px; }
  .reset-btn { border: 0; background: rgba(255,255,255,.1); color: rgba(255,255,255,.6); border-radius: 999px; font-size: 11px; padding: 5px 10px; }
  .model-grid { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 9px; }
  .model { display: flex; align-items: center; gap: 7px; font-size: 10px; color: rgba(255,255,255,.55); }
  .model .track { width: 76px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
  .model .fill { display: block; height: 100%; border-radius: 999px; }
  .model b { color: #fff; font-size: 10px; width: 30px; text-align: right; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px 9px; font-size: 10px; color: rgba(255,255,255,.65); }
  .chip.prod { background: rgba(255,255,255,.06); }
  .chip.new { background:#F59E0B; color:#111; font-weight:800; }
  .profile-link { border:0; background:none; color:#555; font-size:12px; font-weight:600; padding:4px 6px; cursor:pointer; }
  .profile-link:hover { color:#EA1B0A; }
  .profile-btn { border:0; background:rgba(255,255,255,.12); color:#fff; border-radius:999px; font-size:11px; font-weight:700; padding:5px 11px; }
  .profile-btn.changed { background:#F59E0B; color:#111; box-shadow:0 0 0 2px rgba(245,158,11,.25); }
  .model.changed .track { box-shadow:0 0 0 2px rgba(245,158,11,.34); }
  .model-delta { background:#F59E0B; color:#111; font-size:9px; font-weight:800; border-radius:4px; padding:1px 4px; }
  .scenario-change-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .scenario-change { color:#FCD34D; font-size:12px; font-weight:700; }
  .scenario-change-row .change-chip { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.18); color:#DCE6FF; }
  .scenario-decision { border-left:1px solid rgba(255,255,255,.2); padding-left:7px; font-size:11px; color:rgba(226,236,255,.8); }
  .scenario-decision b { color:#fff; }
  .profile-change-link { border:1px solid rgba(245,158,11,.5); background:rgba(245,158,11,.12); color:#FCD34D; border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700; }
  .persona-detail { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-top: 8px; }
  .persona-policy { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.14); }
  .policy-mini { border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04); color:rgba(255,255,255,.58); border-radius:999px; padding:3px 8px; font-size:10px; line-height:1.35; }
  .policy-mini b { color:rgba(255,255,255,.92); font-weight:700; }
  .policy-mini.blocked { border-color:rgba(248,113,113,.35); background:rgba(234,27,10,.12); color:#FCA5A5; }
  .policy-mini.blocked b { color:#FCA5A5; }
  .policy-mini.on { border-color:rgba(74,222,128,.28); background:rgba(34,197,94,.1); color:#86EFAC; }

// ── State ──────────────────────────────────────────────────────────────────
const initialScores = () => Object.fromEntries(Object.entries(PERSONAS).map(([id, p]) => [id, { ...p.scores }]))
const initialHoldings = () => Object.fromEntries(Object.entries(PERSONAS).map(([id, p]) => [id, [...p.holdings]]))

const state = {
  view: 'home',
  customerId: 'eva',
  loggedIn: true,
  anonymous: false,
  personalization: true,
  holdings: initialHoldings(),
  scores: initialScores(),
  newsletter: Object.fromEntries(Object.keys(PERSONAS).map((id) => [id, false])),
  outage: false,
  active: null,          // { key, stepIdx }
  messages: [],          // { customerId, scenarioKey, stepIndex, channel, subject, body, time }
  signalLog: {},         // customerId -> applied scenario signals
  lastChange: null,      // diff from the most recent scenario step
  personaMenu: false,
  explain: false,
  toast: null,           // web inbox notification after a step
  archScenario: 'all',   // architecture view: 'all' or a scenario key
  archNode: null,        // selected capability in the architecture diagram
}

// ── Helpers ────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const pct = (n) => Math.round(n * 100) + '%'
const nowTime = () => new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })
const persona = () => (!state.customerId || state.anonymous) ? null : PERSONAS[state.customerId]
const holdingsOf = (id) => state.holdings[id] ?? []
const owns = (id, name) => holdingsOf(id).includes(name)

function profileFor(id, anonymous = state.anonymous) {
  if (anonymous || !id || !PERSONAS[id]) {
    return {
      id: id || 'anon', name: 'Anonym besökare', tariff: 'none', usage: 0,
      housing: 'Okänd', postcode: 'Okänd', scores: { ...ZERO_SCORES },
      holdings: [], segments: [], signals: ['cookie_only'], evidence: {}, anonymous: true,
    }
  }
  return PERSONAS[id]
}

function scoresOf(id, anonymous = state.anonymous) {
  return { ...ZERO_SCORES, ...(state.scores[id] || {}) }
}

function segmentContext(id, anonymous = state.anonymous) {
  return {
    id,
    profile: profileFor(id, anonymous),
    scores: scoresOf(id, anonymous),
    owns: (name) => holdingsOf(id).includes(name),
  }
}

function segmentsFor(id, anonymous = state.anonymous) {
  if (!id) return []
  const ctx = segmentContext(id, anonymous)
  return SEGMENT_RULES.filter((rule) => rule.test(ctx)).map((rule) => rule.label)
}

function segmentEvaluations(id, anonymous = state.anonymous) {
  const ctx = segmentContext(id, anonymous)
  return SEGMENT_RULES.map((rule) => ({
    ...rule,
    active: rule.test(ctx),
    now: rule.reason(ctx),
  }))
}

function signalLogFor(id) {
  return state.signalLog[id] || []
}

function hasInsight(id, key) {
  return signalLogFor(id).some((s) => s.key === key)
}

function addSignals(id, keys, scene, stepIndex) {
  if (!keys || !keys.length) return
  const log = state.signalLog[id] || (state.signalLog[id] = [])
  keys.forEach((key) => {
    if (log.some((x) => x.key === key && x.scenarioKey === scene.key && x.stepIndex === stepIndex)) return
    const meta = SIGNAL_META[key] || { label: key, source: 'Signal', impact: '' }
    log.push({ key, ...meta, time: nowTime(), scenarioKey: scene.key, stepIndex })
  })
}

function profileSignals(id, anonymous = state.anonymous) {
  const base = (profileFor(id, anonymous).signals || []).map((key) => ({
    key, ...(SIGNAL_META[key] || { label: key, source: 'Signal', impact: '' }),
  }))
  return [...base, ...signalLogFor(id)]
}

const isOutboundActive = (id) => !!id && hasInsight(id, 'outbound_enrolled') && !owns(id, 'Kvartspris + Smartladdning')

function channelPolicy(id, anonymous, d) {
  const known = !anonymous && !!PERSONAS[id]
  const loggedIn = known && state.loggedIn
  const outbound = known && isOutboundActive(id)
  const service = state.outage || d?.nba?.type === 'outage' || d?.nba?.type === 'retention' || d?.nba?.type === 'smart_heating'
  return [
    { key: 'web', label: 'Webb', on: true, note: known ? 'Personliga ytor' : 'Kontextuellt innehåll' },
    { key: 'inbox', label: 'Inkorg', on: loggedIn, note: loggedIn ? 'Webb + app' : 'Kräver inloggning' },
    { key: 'email', label: 'E-post', on: known, note: known ? (service ? 'Service/retention' : 'Enligt kanalval') : 'Kräver identitet' },
    { key: 'sms', label: 'SMS', on: known && (state.outage || outbound), note: state.outage ? 'Service' : outbound ? 'Outbound' : 'Service/opt-in' },
    { key: 'push', label: 'Push', on: loggedIn, note: loggedIn ? (service ? 'Service i appen' : 'Appnotis') : 'Kräver inloggning' },
  ]
}

function timingPolicy(id, anonymous, d) {
  if (state.outage) return { key: 'outage', label: 'Direkt', detail: 'Serviceundantag – driftinformation går före frekvenscap.' }
  if (anonymous) return { key: 'anonymous', label: 'Endast webb', detail: 'Ingen outbound utan identitet.' }
  if (!state.loggedIn) return { key: 'loggedout', label: 'Inga utskick', detail: 'Kräver inloggning för profil och kontakt.' }
  if (d?.nba?.type === 'retention') return { key: 'retention', label: 'Direkt', detail: 'Retention prioriteras; kommersiella utskick pausas.' }
  if (isOutboundActive(id)) return { key: 'outbound', label: 'Kväll 18–21', detail: 'Outbound-flöde; första påminnelse nästa kväll.' }
  if (d?.nba?.type === 'smart_heating') return { key: 'service', label: 'Direkt i appen', detail: 'Serviceåtgärd; ingen säljkampanj.' }
  return { key: 'commercial', label: 'Kväll 18–21', detail: 'Kommersiellt utskick enligt tysta timmar.' }
}

function capPolicy(id, anonymous, d) {
  if (anonymous) return 'Ingen outbound'
  if (!state.loggedIn) return 'Inga utskick'
  if (state.outage || d?.nba?.type === 'retention' || d?.nba?.type === 'smart_heating') return 'Serviceundantag'
  if (isOutboundActive(id)) return 'Max 1 påminnelse / 3 dagar'
  return 'Max 1 kommersiellt utskick / 7 dagar'
}

function policyState(id = state.customerId || 'anon', d = decide()) {
  const anonymous = state.anonymous || !id || !PERSONAS[id]
  const s = scoresOf(id, anonymous)
  const rules = []
  const add = (key, label, value, status, detail) => rules.push({ key, label, value, status, detail })

  add('personalization', 'Personalisering', state.personalization ? 'På' : 'Av', state.personalization ? 'on' : 'blocked',
    state.personalization ? 'Profilbaserat NBO/NBA är tillåtet.' : 'Endast generellt innehåll; inga personliga erbjudanden.')
  if (anonymous) {
    add('identity', 'Identitet', 'Anonym cookie', 'blocked', 'Ingen kundprofil; endast webb och nödvändiga cookies.')
  } else if (!state.loggedIn) {
    add('identity', 'Identitet', 'Känd men utloggad', 'blocked', 'Kräver inloggning för profil och utskick.')
  } else {
    add('identity', 'Identitet', 'Inloggad kund', 'on', 'Cookie är kopplad till kundprofilen.')
  }

  if (state.outage) {
    add('outage', 'Avbrottssuppression', 'Aktiv', 'blocked', 'Kommersiellt stoppas; driftinformation prioriteras.')
  } else {
    add('outage', 'Avbrottssuppression', 'Nej', 'off', 'Inget aktivt avbrott.')
  }

  if (s.churn >= 0.7) {
    add('churn', 'Churn-suppression', `Churn ${pct(s.churn)} ≥ 70%`, 'blocked', 'Kommersiellt NBO stoppas; retention blir NBA.')
  } else {
    add('churn', 'Churn-tröskel', `Churn ${pct(s.churn)} < 70%`, 'on', 'Under tröskeln – kommersiella erbjudanden tillåtna.')
  }

  if (!anonymous) {
    if (hasInsight(id, 'heat_pump_detected')) {
      add('heatpump', 'Ägande: värmepump', 'Befintlig', 'blocked', 'Värmepumpserbjudandet stoppas; smart styrning blir NBA.')
    } else if (hasInsight(id, 'electric_heating_detected')) {
      add('heatpump', 'Elvärme utan värmepump', 'Identifierad', 'on', 'Värmepumpserbjudandet tillåts.')
    }
    if (owns(id, 'Kvartspris + Smartladdning')) {
      add('ev_owned', 'Ägande: EV-paket', 'Befintligt', 'blocked', 'NBO för Kvartspris + Smartladdning stoppas.')
    } else if (s.ev >= 0.6) {
      add('ev_score', 'EV-benägenhet ≥ 60%', 'Uppfylld', 'on', 'Kvartspris + Smartladdning är kvalificerat.')
    }
    if (owns(id, 'Rörligt elpris')) add('green_owned', 'Ägande: grön el', 'Befintligt', 'blocked', 'Green-erbjudandet stoppas.')
    if (owns(id, 'Solceller')) add('solar_owned', 'Ägande: solceller', 'Befintligt', 'blocked', 'Solarerbjudandet stoppas.')
    if (isOutboundActive(id)) add('outbound', 'Outbound-flöde', 'Aktivt', 'on', 'Nurture pågår; nästa kontakt kvällstid.')
    if (state.newsletter[id]) add('newsletter', 'Nyhetsbrev', 'Prenumererar', 'blocked', 'Nyhetsbrevs-NBA tas bort.')
  }

  return {
    nbo: d?.nbo?.name || 'Inget kommersiellt erbjudande',
    nba: d?.nba?.headline || 'Ingen nästa bästa åtgärd',
    rule: d?.rule || '',
    rules,
    channels: channelPolicy(id, anonymous, d),
    timing: timingPolicy(id, anonymous, d),
    cap: capPolicy(id, anonymous, d),
  }
}

function diffPolicy(before = {}, after = {}) {
  const changes = []
  const add = (key, label, from, to) => {
    const a = from == null || from === '' ? '–' : String(from)
    const b = to == null || to === '' ? '–' : String(to)
    if (a !== b) changes.push({ key, label, from: a, to: b })
  }
  add('nbo', 'NBO', before.nbo, after.nbo)
  add('nba', 'NBA', before.nba, after.nba)

  const bRules = Object.fromEntries((before.rules || []).map((r) => [r.key, r]))
  const aRules = Object.fromEntries((after.rules || []).map((r) => [r.key, r]))
  const ruleKeys = [...new Set([...Object.keys(bRules), ...Object.keys(aRules)])]
  ruleKeys.forEach((key) => {
    const b = bRules[key]
    const a = aRules[key]
    const bv = b ? `${b.value}${b.status === 'blocked' ? ' (stoppad)' : ''}` : '–'
    const av = a ? `${a.value}${a.status === 'blocked' ? ' (stoppad)' : ''}` : '–'
    add(`rule:${key}`, a?.label || b?.label || key, bv, av)
  })

  const bChannels = Object.fromEntries((before.channels || []).map((c) => [c.key, c]))
  const aChannels = Object.fromEntries((after.channels || []).map((c) => [c.key, c]))
  ;[...new Set([...Object.keys(bChannels), ...Object.keys(aChannels)])].forEach((key) => {
    const b = bChannels[key]
    const a = aChannels[key]
    const label = a?.label || b?.label || key
    add(`channel:${key}`, `Kanal: ${label}`, b ? (b.on ? 'På' : 'Av') : '–', a ? (a.on ? 'På' : 'Av') : '–')
  })

  add('timing', 'Timing', before.timing ? `${before.timing.label} · ${before.timing.detail}` : '–',
    after.timing ? `${after.timing.label} · ${after.timing.detail}` : '–')
  add('cap', 'Frekvens', before.cap, after.cap)
  return changes
}

function snapshotState() {
  const id = state.customerId || 'anon'
  const decision = decide()
  return {
    id,
    anonymous: state.anonymous,
    loggedIn: state.loggedIn,
    outage: state.outage,
    scores: scoresOf(id),
    segments: segmentsFor(id),
    holdings: [...holdingsOf(id)],
    newsletter: !!state.newsletter[id],
    decision,
    policy: policyState(id, decision),
  }
}

function diffState(before, after, scene, step, stepIndex) {
  const scores = {}
  Object.keys(SCORE_META).forEach((key) => {
    const from = before.scores[key] ?? 0
    const to = after.scores[key] ?? 0
    if (from !== to) scores[key] = { from, to }
  })
  const b = before.decision || {}
  const a = after.decision || {}
  const decisionChanged = b.rule !== a.rule
    || (b.nbo?.name || '') !== (a.nbo?.name || '')
    || (b.nba?.headline || '') !== (a.nba?.headline || '')
  const policyChanges = diffPolicy(before.policy, after.policy)
  return {
    customerId: after.id,
    anonymous: after.anonymous,
    scenarioKey: scene.key,
    stepIndex,
    stepLabel: step.label,
    scores,
    segmentsAdded: after.segments.filter((s) => !before.segments.includes(s)),
    segmentsRemoved: before.segments.filter((s) => !after.segments.includes(s)),
    holdingsAdded: after.holdings.filter((h) => !before.holdings.includes(h)),
    newsletterChanged: before.newsletter !== after.newsletter,
    decisionChanged,
    policyChanged: policyChanges.length > 0,
    policyChanges,
    decisionBefore: { rule: b.rule || '', nbo: b.nbo?.name || null, nba: b.nba?.headline || null },
    decisionAfter: { rule: a.rule || '', nbo: a.nbo?.name || null, nba: a.nba?.headline || null },
    signals: step.signals || [],
    notes: step.notes || [],
    time: nowTime(),
  }
}

// ── Decisioning (hardcoded NBO/NBA rules) ─────────────────────────────────
function decide() {
  const id = state.customerId
  const isKnown = !!id && !state.anonymous

  if (!isKnown) {
    // Anonymous visitor: behavioural signals only
    const anonScores = id ? state.scores[id] : null
    if (anonScores && anonScores.ev >= 0.6) {
      return { nbo: OFFERS.bundle, nba: null, rule: 'Anonym besökare med EV-signaler → paketet', segments: ['ev prospects'], anonymous: true }
    }
    return { nbo: null, nba: null, rule: 'Anonym besökare – inga signaler ännu', segments: [], anonymous: true }
  }

  const s = state.scores[id]
  const segs = segmentsFor(id)

  if (!state.personalization) {
    return { nbo: null, nba: null, rule: 'Personalisering avstängd', segments: segs, fallback: true }
  }

  if (state.outage) {
    return {
      nbo: null,
      nba: {
        type: 'outage', headline: 'Strömavbrott i ditt område',
        body: 'Vi arbetar på avbrottet i ditt lokala elnät. Beräknad återställning: ca 2 timmar.',
        cta: 'Se driftstatus',
      },
      rule: 'Driftstörning → allt kommersiellt undertrycks',
      segments: segs,
    }
  }

  if (!state.loggedIn) {
    return { nbo: null, nba: null, rule: 'Utloggad – generellt innehåll', segments: [], fallback: true }
  }

  if (s.churn >= 0.7) {
    return {
      nbo: null,
      nba: {
        type: 'retention', headline: 'Vi vill behålla dig som kund',
        body: 'Innan du byter — låt oss titta på ditt pris. Vi slopar månadsavgiften i sex månader.',
        cta: 'Se ditt erbjudande', url: 'tariffs',
      },
      rule: 'Churn-risk ≥ 0,7 → kommersiellt NBO stoppas, retention blir NBA',
      segments: segs,
    }
  }

  const ownsHeatPump = hasInsight(id, 'heat_pump_detected')
  const heatPumpGuard = ownsHeatPump
    ? ' · befintlig värmepump → värmepumpserbjudandet stoppas, smart styrning blir NBA'
    : ''
  const nba = ownsHeatPump
    ? smartHeatingNba()
    : (state.newsletter[id] ? null : newsletterNba())

  // The customer has direct electric heating but no heat pump: sell the upgrade.
  if (!ownsHeatPump && hasInsight(id, 'electric_heating_detected')) {
    return { nbo: OFFERS.varmepump, nba, rule: 'Elvärme utan värmepump → värmepumpserbjudande', segments: segs }
  }

  if (s.ev >= 0.6 && owns(id, 'Kvartspris + Smartladdning')) {
    return {
      nbo: null,
      nba,
      rule: 'EV ≥ 0,6 men kunden äger redan Kvartspris + Smartladdning → NBO undertrycks',
      segments: segs,
    }
  }

  if (s.ev >= 0.6 && !owns(id, 'Kvartspris + Smartladdning')) {
    return { nbo: OFFERS.bundle, nba, rule: 'EV-benägenhet ≥ 0,6 → Kvartspris + Smartladdning' + heatPumpGuard, segments: segs }
  }

  if (s.solar >= 0.7 && !owns(id, 'Solceller')) {
    return { nbo: OFFERS.solar, nba, rule: 'Solintresse ≥ 0,7 → solcellsanalys' + heatPumpGuard, segments: segs }
  }

  if (s.green >= 0.7 && !owns(id, 'Rörligt elpris')) {
    return { nbo: OFFERS.green, nba, rule: 'Grönbenägenhet ≥ 0,7 → fossilfri rörlig el' + heatPumpGuard, segments: segs }
  }

  // Persona defaults (what the demo DB serves for each profile)
  const defaults = {
    eva: { nbo: OFFERS.laddbox, nba: newsletterNba() },
    karin: { nbo: OFFERS.varmepump, nba: newsletterNba() },
    jonas: { nbo: OFFERS.bundle, nba: newsletterNba() },
    lars: { nbo: OFFERS.retention, nba: null },
    anders: { nbo: OFFERS.green, nba: newsletterNba() },
  }
  const d = defaults[id] ?? { nbo: null, nba: null }
  const suppressHeatPumpOffer = ownsHeatPump && d.nbo?.id === 'varmepump'
  const defaultNba = ownsHeatPump ? smartHeatingNba() : (state.newsletter[id] ? null : d.nba)
  return {
    nbo: suppressHeatPumpOffer ? null : d.nbo,
    nba: defaultNba,
    rule: suppressHeatPumpOffer
      ? 'Kunden har redan värmepump → ingen värmepumpsförsäljning; smart styrning'
      : 'Profilbaserat erbjudande',
    segments: segs,
  }
}

    body: 'Du har redan en värmepump. Aktivera smart värmestyrning så följer uppvärmningen elpriset och undviker onödiga toppar.',

// ── Rendering: customer profile (segments, scoring & rationale) ───────────
function renderChangeFacts(c) {
  const facts = []
  Object.entries(c.scores || {}).forEach(([key, d]) => {
    facts.push(`<span class="change-chip score">${esc(SCORE_META[key]?.short || key)} ${pct(d.from)} → ${pct(d.to)}</span>`)
  })
  ;(c.segmentsAdded || []).forEach((s) => facts.push(`<span class="change-chip seg">+ ${esc(s)}</span>`))
  ;(c.segmentsRemoved || []).forEach((s) => facts.push(`<span class="change-chip removed">− ${esc(s)}</span>`))
  ;(c.holdingsAdded || []).forEach((h) => facts.push(`<span class="change-chip hold">+ ${esc(h)}</span>`))
  if (c.newsletterChanged) facts.push('<span class="change-chip">Nyhetsbrev uppdaterat</span>')
  if (c.decisionChanged) facts.push('<span class="change-chip decision">Beslut uppdaterat</span>')
  if (c.policyChanged) facts.push('<span class="change-chip decision">Regler/kanaler uppdaterade</span>')
  if (!facts.length) {
    ;(c.signals || []).forEach((s) => {
      const meta = SIGNAL_META[s]
      if (meta) facts.push(`<span class="change-chip">${esc(meta.label)}</span>`)
    })
  }
  if (!facts.length) facts.push('<span class="change-chip">Profilen uppdaterad</span>')
  return facts.join('')
}

function renderChangeBanner(c) {
  return `<div class="change-banner">
    <div class="change-head">
      <span class="change-kicker">SENASTE SCENARIOSTEG</span>
      <b>${esc(c.stepLabel)}</b>
      <span class="change-time">${esc(c.time)}</span>
    </div>
    <div class="change-facts">${renderChangeFacts(c)}</div>
    ${c.notes?.length ? `<p class="change-note">${c.notes.map(esc).join(' · ')}</p>` : ''}
  </div>`
}

function renderProfileScore(key, id, scores, profile, change) {
  const meta = SCORE_META[key]
  const value = scores[key] ?? 0
  const delta = change?.scores?.[key]
  const baseline = profile.scores?.[key] ?? 0
  const marker = meta.threshold != null
    ? `<i class="score-marker" style="left:${meta.threshold * 100}%" title="Tröskel ${pct(meta.threshold)}"></i>`
    : ''
  const drivers = (SCORE_DRIVERS[key] || []).map((d) => `
    <div class="driver">
      <span>${esc(d.label)}</span>
      <span class="driver-bar"><i style="width:${Math.round(d.weight * 100)}%;background:${meta.color}"></i></span>
      <b>${Math.round(d.weight * 100)}%</b>
    </div>`).join('')
  return `<div class="score-card ${delta ? 'changed' : ''}">
    <div class="score-head"><span>${esc(meta.label)}</span><b>${pct(value)}</b></div>
    <div class="score-sub">${delta
      ? `<span class="score-delta">↑ ${pct(delta.from)} → ${pct(delta.to)} i senaste steget</span>`
      : `Baseline ${pct(baseline)}`}</div>
    <div class="score-meter">${marker}<span class="score-fill" style="width:${pct(value)};background:${meta.color}"></span></div>
    <p class="score-desc">${esc(meta.desc)}</p>
    <p class="score-evidence"><b>Varför:</b> ${esc(profile.evidence?.[key] || meta.evidence)}</p>
    <p class="score-threshold">${esc(meta.thresholdLabel)}</p>
    <div class="driver-list">${drivers}</div>
  </div>`
}

function renderProfileRule(e, change) {
  const added = change?.segmentsAdded?.includes(e.label)
  const removed = change?.segmentsRemoved?.includes(e.label)
  return `<div class="rule ${e.active ? 'on' : ''} ${added ? 'is-new' : ''}">
    <div class="rule-top">
      <span class="rule-dot"></span><b>${esc(e.label)}</b>
      <span class="rule-state ${e.active ? 'on' : 'off'}">${e.active ? 'AKTIV' : 'EJ AKTIV'}</span>
      ${added ? '<span class="rule-flag">NY</span>' : ''}
      ${removed ? '<span class="rule-flag removed">BORTTAGEN</span>' : ''}
    </div>
    <p class="rule-threshold">${esc(e.threshold)}</p>
    <p class="rule-now">${esc(e.now)}</p>

}

function offerLabel(offer) {
  if (!offer) return 'Inget erbjudande'
  if (offer.id === 'green') return 'Rörligt elpris (fossilfri)'
  if (offer.id === 'retention') return 'Retention (Fast elpris)'
  return offer.name
}

function decisionCandidates(d) {
  const id = state.customerId
  const known = !!id && !state.anonymous
  const s = scoresOf(id || 'anon', state.anonymous)
  const ownsBundle = known && owns(id, 'Kvartspris + Smartladdning')
  const ownsGreen = known && owns(id, 'Rörligt elpris')
  const ownsSolar = known && owns(id, 'Solceller')
  const heatPump = known && hasInsight(id, 'heat_pump_detected')
  const electricHeating = known && hasInsight(id, 'electric_heating_detected')
  const chosenNbo = d.nbo?.id || null
  const chosenNba = d.nba?.type || null
  const rows = []
  const add = (type, name, status, reason) => rows.push({ type, name, status, reason })

  const gate = !known
    ? 'Anonym besökare – endast beteendesignaler'
    : !state.personalization
      ? 'Personalisering avstängd'
      : state.outage
        ? 'Pågående avbrott – kommersiella erbjudanden stoppas'
        : !state.loggedIn
          ? 'Utloggad – ingen identifierad kund'
          : s.churn >= 0.7
            ? 'Churn ≥ 70% – retention prioriteras'
            : null

  // NBO: EV package
  let bundleStatus = 'not_selected'
  let bundleReason = `EV ${pct(s.ev)} < 60%`
  if (!known) {
    if (s.ev >= 0.6) {
      bundleStatus = 'chosen'
      bundleReason = `Anonyma EV-signaler ${pct(s.ev)} ≥ 60%`
    }
  } else if (ownsBundle) {
    bundleStatus = 'suppressed'
    bundleReason = 'Kunden äger redan Kvartspris + Smartladdning'
  } else if (gate) {
    bundleStatus = 'suppressed'
    bundleReason = gate
  } else if (chosenNbo === 'bundle') {
    bundleStatus = 'chosen'
    bundleReason = s.ev >= 0.6
      ? `EV ${pct(s.ev)} ≥ 60% och paketet ägs inte`
      : `Profilbaserad default för ${profileFor(id).name}`
  } else if (s.ev >= 0.6) {
    bundleStatus = 'not_selected'
    bundleReason = chosenNbo === 'varmepump'
      ? 'Elvärmesignalen har högre prioritet'
      : chosenNbo === 'solar'
        ? 'Solpotentialen har högre prioritet'
        : 'EV-regeln passerar men ett annat beslut valdes'
  }
  add('NBO', 'Kvartspris + Smartladdning', bundleStatus, bundleReason)

  // NBO: green offer
  let greenStatus = 'not_selected'
  let greenReason = `Green ${pct(s.green)} < 70%`
  if (!known) {
    greenStatus = 'suppressed'
    greenReason = 'Anonym besökare – grönt erbjudande kräver profil'
  } else if (ownsGreen) {
    greenStatus = 'suppressed'
    greenReason = 'Kunden äger redan rörligt elpris'
  } else if (state.outage) {
    greenStatus = 'suppressed'
    greenReason = 'Pågående avbrott – kommersiella erbjudanden stoppas'
  } else if (!state.personalization) {
    greenStatus = 'suppressed'
    greenReason = 'Personalisering avstängd'
  } else if (!state.loggedIn) {
    greenStatus = 'suppressed'
    greenReason = 'Utloggad – ingen identifierad kund'
  } else if (s.churn >= 0.7) {
    greenStatus = 'suppressed'
    greenReason = 'Churn ≥ 70% – grönt erbjudande exkluderas'
  } else if (chosenNbo === 'green') {
    greenStatus = 'chosen'
    greenReason = s.green >= 0.7
      ? `Green ${pct(s.green)} ≥ 70% och kunden äger inte rörligt`
      : `Profilbaserad default för ${profileFor(id).name}`
  } else if (chosenNbo === 'bundle') {
    greenStatus = 'not_selected'
    greenReason = 'EV-paketet har högre prioritet'
  } else if (s.green >= 0.7) {
    greenStatus = 'not_selected'
    greenReason = chosenNbo === 'solar'
      ? 'Solpotentialen har högre prioritet'
      : chosenNbo === 'varmepump'
        ? 'Elvärmesignalen har högre prioritet'
        : 'Green-regeln passerar men ett annat beslut valdes'
  }
  add('NBO', 'Rörligt elpris (fossilfri)', greenStatus, greenReason)

  // NBO: solar analysis
  let solarStatus = 'not_selected'
  let solarReason = `Solintresse ${pct(s.solar)} < 70%`
  if (!known) {
    solarStatus = 'suppressed'
    solarReason = 'Anonym besökare – solpotential kräver profil'
  } else if (ownsSolar) {
    solarStatus = 'suppressed'
    solarReason = 'Kunden äger redan solceller'
  } else if (gate) {
    solarStatus = 'suppressed'
    solarReason = gate
  } else if (chosenNbo === 'solar') {
    solarStatus = 'chosen'
    solarReason = `Solintresse ${pct(s.solar)} ≥ 70% och kunden äger inte solceller`
  } else if (s.solar >= 0.7) {
    solarStatus = 'not_selected'
    solarReason = chosenNbo === 'bundle'
      ? 'EV-paketet har högre prioritet'
      : chosenNbo === 'green'
        ? 'Green-erbjudandet har högre prioritet'
        : chosenNbo === 'varmepump'
          ? 'Elvärmesignalen har högre prioritet'
          : 'Solregeln passerar men ett annat beslut valdes'
  }
  add('NBO', 'Solcellsanalys', solarStatus, solarReason)

  // NBO: heat pump. Existing heat pump owners are never sold another heat pump.
  const defaults = { eva: OFFERS.laddbox, karin: OFFERS.varmepump, jonas: OFFERS.bundle, lars: OFFERS.retention, anders: OFFERS.green }
  if (known && (heatPump || electricHeating || chosenNbo === 'varmepump' || defaults[id]?.id === 'varmepump')) {
    let hpStatus = 'not_selected'
    let hpReason = 'Profilbaserad default, men EV-paketet har högre prioritet'
    if (heatPump) {
      hpStatus = 'suppressed'
      hpReason = 'Kunden har redan en värmepump – smart styrning erbjuds i stället'
    } else if (chosenNbo === 'varmepump') {
      hpStatus = 'chosen'
      hpReason = electricHeating
        ? 'Elvärme utan värmepump (NILM)'
        : `Profilbaserad default för ${profileFor(id).name}`
    } else if (gate) {
      hpStatus = 'suppressed'
      hpReason = gate
    } else if (electricHeating) {
      hpReason = 'Elvärmesignalen finns men ett annat beslut valdes'
    }
    add('NBO', 'Värmepumpsrabatt upp till 2 000 kr', hpStatus, hpReason)
  }

  // Persona default offer, when it is not already represented by EV/green/solar/heat pump
  if (known && d.nbo && !['bundle', 'green', 'solar', 'varmepump'].includes(d.nbo.id)) {
    add('NBO', offerLabel(d.nbo), 'chosen', `Profilbaserad default för ${profileFor(id).name}`)
  } else if (known && defaults[id] && !['bundle', 'green', 'solar', 'varmepump'].includes(defaults[id].id)) {
    add('NBO', offerLabel(defaults[id]), gate ? 'suppressed' : 'not_selected',
      gate || 'Profilbaserad default, men en högre regel valdes')
  }

  // NBA: retention
  if (known && s.churn >= 0.7) {
    add('NBA', 'Retention', chosenNba === 'retention' ? 'chosen' : 'suppressed',
      chosenNba === 'retention' ? `Churn ${pct(s.churn)} ≥ 70%` : (gate || 'Högre prioriterad NBA'))
  } else {
    add('NBA', 'Retention', chosenNba === 'retention' ? 'chosen' : 'not_selected',
      chosenNba === 'retention' ? `Churn ${pct(s.churn)} ≥ 70%` : `Churn ${pct(s.churn)} < 70%`)
  }

  // NBA: outage information
  if (known && state.outage) {
    add('NBA', 'Driftinformation', chosenNba === 'outage' ? 'chosen' : 'suppressed',
      chosenNba === 'outage' ? 'Pågående avbrott – driftinformation prioriteras' : 'Avbrottet matchas mot område')
  } else {
    add('NBA', 'Driftinformation', chosenNba === 'outage' ? 'chosen' : 'not_selected',
      chosenNba === 'outage' ? 'Pågående avbrott' : 'Inget aktivt avbrott')
  }

  // NBA: smart heating for customers who already own a heat pump
  if (known && (heatPump || chosenNba === 'smart_heating')) {
    const smartStatus = chosenNba === 'smart_heating' ? 'chosen' : 'suppressed'
    add('NBA', 'Smart värmestyrning', smartStatus,
      chosenNba === 'smart_heating'
        ? 'Kunden har redan värmepump – service före försäljning'
        : (gate || 'Högre prioriterad NBA'))
  }

  // NBA: newsletter
  if (chosenNba === 'newsletter') {
    add('NBA', 'Nyhetsbrev', 'chosen', 'Kunden prenumererar inte och ingen högre prioriterad NBA är aktiv')
  } else if (known && state.newsletter[id]) {
    add('NBA', 'Nyhetsbrev', 'suppressed', 'Kunden prenumererar redan')
  } else if (gate) {
    add('NBA', 'Nyhetsbrev', 'suppressed', gate)
  } else if (chosenNba) {
    add('NBA', 'Nyhetsbrev', 'suppressed', `Högre prioriterad NBA: ${d.nba?.headline || chosenNba}`)
  } else {
    add('NBA', 'Nyhetsbrev', 'not_selected', 'Ingen NBA vald i detta läge')
  }

  return rows
}

function renderDecisionCandidate(row) {
  const label = row.status === 'chosen' ? 'VALD' : row.status === 'suppressed' ? 'STOPPAD' : 'EJ VALD'
  return `<div class="trace-row ${row.status}">
    <span class="trace-type ${row.type.toLowerCase()}">${row.type}</span>
    <div class="trace-main"><b>${esc(row.name)}</b><p>${esc(row.reason)}</p></div>
    <span class="trace-status ${row.status}">${label}</span>
  </div>`
}

function renderProfileDecision(d, id, anonymous) {
  const nbo = d.nbo
  const nba = d.nba
  const s = scoresOf(id, anonymous)
  const reasons = []
  if (!state.personalization) reasons.push('personalisering avstängd')
  if (state.outage) reasons.push('pågående avbrott')
  if (!state.loggedIn) reasons.push('utloggad')
  if (s.churn >= 0.7) reasons.push('churn ≥ 70%')
  if (hasInsight(id, 'heat_pump_detected')) reasons.push('kunden har redan värmepump')
  if (hasInsight(id, 'electric_heating_detected')) reasons.push('elvärme utan värmepump')
  if (s.ev >= 0.6 && owns(id, 'Kvartspris + Smartladdning')) reasons.push('äger redan Kvartspris + Smartladdning')
  if (anonymous) reasons.push('ingen kundprofil')
  return `
    <div class="decision-row">
      <span class="decision-tag nbo">NBO</span>
      <div>
        <b>${nbo ? esc(nbo.name) : 'Inget kommersiellt erbjudande'}</b>
        <p>${nbo ? esc(nbo.headline) : 'Inget NBO i detta läge.'}</p>
        ${nbo ? `<span class="decision-meta">${esc(nbo.product)} · ${esc(nbo.value)}</span>` : ''}
      </div>
    </div>
    <div class="decision-row">
      <span class="decision-tag nba">NBA</span>
      <div>
        <b>${nba ? esc(nba.headline) : 'Ingen nästa bästa åtgärd'}</b>
        <p>${nba ? esc(nba.body) : 'Ingen NBA i detta läge.'}</p>
      </div>
    </div>
    <p class="decision-rule"><b>Regel:</b> ${esc(d.rule)}</p>
    <p class="decision-rule"><b>Segment:</b> ${d.segments?.length ? d.segments.map(esc).join(', ') : '–'}</p>
    <p class="decision-rule"><b>Begränsningar:</b> ${reasons.length ? reasons.map(esc).join(', ') : 'inga aktiva'}</p>
    <p class="trace-title">NBO/NBA-kandidater</p>
    <p class="trace-order">Prövas i ordning: samtycke → avbrott → inloggning → churn → värmepump/elvärme → EV → green → profildefault.</p>
    <div class="decision-trace">${decisionCandidates(d).map(renderDecisionCandidate).join('')}</div>`
}

function renderPolicyPanel(d, id, anonymous, change) {
  const p = policyState(id, d)
  const changes = change?.policyChanges || []
  const changed = new Set(changes.map((c) => c.key))
  const changeFor = (key) => changes.find((c) => c.key === key)
  const fromNote = (key) => {
    const c = changeFor(key)
    return c ? `<span class="policy-from">Ändrat: ${esc(c.from)} → ${esc(c.to)}</span>` : ''
  }
  const blocked = p.rules.find((r) => r.status === 'blocked' && r.key !== 'personalization' && r.key !== 'identity')
  const rulesChanged = p.rules.some((r) => changed.has(`rule:${r.key}`))
  const channelsChanged = p.channels.some((c) => changed.has(`channel:${c.key}`))

  return `<div class="profile-card profile-policy" id="profile-policy">
    <h2>Aktiva regler, kanaler & timing</h2>
    <p class="sub">NBO/NBA och reglerna som just nu tillåter eller stoppar kommunikation. Ändrade fält markeras när scenariot stegar.</p>
    <div class="policy-grid">
      <div class="policy-block ${changed.has('nbo') ? 'changed' : ''}">
        <span class="policy-kicker">NBO · nu</span>
        <b class="policy-value">${esc(p.nbo)}</b>
        ${fromNote('nbo')}
      </div>
      <div class="policy-block ${changed.has('nba') ? 'changed' : ''}">
        <span class="policy-kicker">NBA · nu</span>
        <b class="policy-value">${esc(p.nba)}</b>
        ${fromNote('nba')}
      </div>
      <div class="policy-block ${blocked && changed.has(`rule:${blocked.key}`) ? 'changed' : ''}">
        <span class="policy-kicker">Suppression · nu</span>
        <b class="policy-value">${blocked ? esc(blocked.label) : 'Ingen aktiv'}</b>
        <span class="policy-detail">${blocked ? esc(blocked.detail) : 'Inga kommersiella stopp i detta läge.'}</span>

function archNodeButton(id) {
  const n = ARCH_NODES[id]
  const layer = archLayerOf(id)
  const active = state.archScenario !== 'all' && archUsed(id)
  const selected = state.archNode === id
  const marked = active
  return `<button class="arch-node ${active ? 'active' : ''} ${selected ? 'sel' : ''}"

      data-arch-node="${id}" title="${esc(n.desc)}">

      <b>${esc(n.label)}</b>

function archFlowRow(i) {
  const labels = [

function archNodeInfo() {
  const id = state.archNode

  const n = ARCH_NODES[id]

function archMatrix() {
  const keys = SCENARIOS.map((s) => s.key)
  const short = { ev_journey: 'Elbil', outage: 'Avbrott', price_compare: 'Riskzon', green_interest: 'Grönt', anon_smart: 'Anonym', anon_to_profile: 'Anon→kund', hidden_ev: 'Dold EV', heat_pump: 'Bef. VP', heating_upgrade: 'Elvärme', solar_profile: 'Solar' }
  const head = `<tr><th>Förmåga</th>${SCENARIOS.map((s) => `<th title="${esc(s.title)}">${esc(short[s.key] || s.title)}</th>`).join('')}</tr>`
  const body = ARCH_LAYERS.map((layer) => {
    const rows = layer.nodes
    if (!rows.length) return ''
    return `<tr class="group"><td colspan="${keys.length + 1}">${esc(layer.title)}</td></tr>` +
      rows.map((id) => {
        const n = ARCH_NODES[id]
        return `<tr>
          <td>${n.icon} ${esc(n.label)}</td>
          ${keys.map((k) => {
            const on = ARCH_SCENARIOS[k].nodes.includes(id)
            return `<td class="${on ? 'on' : ''}">${on ? '<span class="yes"></span>' : '<span class="no">·</span>'}</td>`
          }).join('')}
        </tr>`
      }).join('')
  }).join('')
  return `<table class="arch-matrix"><thead>${head}</thead><tbody>${body}</tbody></table>`
}

// ── Rendering: channel rail ───────────────────────────────────────────────
const CHANNELS = [
  { key: 'inbox', title: 'Inkorg', caption: 'Samma meddelanden i webb och app', icon: '📥', bg: '#E7F0FB', headerBg: '#FFFFFF', accent: '#2563EB', light: true },
  { key: 'sms', title: 'SMS', caption: 'SMS till mobilen', icon: '💬', bg: '#0F172A', headerBg: 'rgba(255,255,255,0.06)', accent: '#34D399', light: false },
  { key: 'email', title: 'E-post', caption: 'E-post till inkorgen', icon: '✉️', bg: '#FFF9EC', headerBg: '#FFFFFF', accent: '#F59E0B', light: true },
  { key: 'push', title: 'Push', caption: 'Notiser i appen', icon: '🔔', bg: '#F6F2FF', headerBg: '#FFFFFF', accent: '#C026D3', light: true },
]

function renderRail() {
  const msgs = completedMessages()
  const total = msgs.length
  const key = state.customerId || (state.anonymous ? 'anon' : '')
  const intro = !key
    ? 'Välj en persona (eller kör en anonym demo) så visas alla kanaler här.'
    : total === 0
      ? 'Inga meddelanden ännu. Kanalerna finns alltid med — välj ett scenario i persona-baren, så fylls de steg för steg.'
      : `${total} meddelanden ut till kunden, visas på alla kanaler samtidigt.`
  const panels = CHANNELS.map((c, i) => {
    const list = msgs.filter((m) => m.channel === c.key)
    return `<div class="${i > 0 ? 'divider' : ''}">${panel(c, list)}</div>`
  }).join('')
  return `
    <div class="rail-head">
      <p class="kicker">Utgående kanaler</p>
      <h2>Så når vi kunden</h2>
      <p>Inkorg · SMS · E-post · Push</p>
    </div>
    <div class="rail-body"><p class="rail-intro">${intro}</p>${panels}</div>`
}

function emptyRail(hint) {
  return `<div class="rail-empty"><div class="icon">📭</div><p>${hint}</p></div>`
}

function panel(c, list) {
  const primary = c.light ? '#1A1A1A' : '#FFFFFF'
  const muted = c.light ? 'rgba(26,26,26,.55)' : 'rgba(255,255,255,.55)'
  const divider = c.light ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.08)'
  const count = `<span class="count" style="background:${c.accent}1c;color:${c.accent}">${list.length}</span>`
  const head = `<div class="panel-head" style="background:${c.headerBg};border-bottom-color:${c.accent}">
      <span class="pic" style="background:${c.accent}22">${c.icon}</span>
      <div class="t"><b style="color:${primary}">${c.title}</b><span style="color:${muted}">${c.caption}</span></div>
      ${count}
    </div>`
  let inner
  if (!list.length) {
    inner = `<p class="panel-body none" style="color:${muted}">Inga meddelanden på den här kanalen ännu.</p>`
  } else if (c.key === 'sms') {
    inner = `<div class="panel-body">${list.map((m) => `
      <div class="sms-row"><div class="sms-bubble">${esc(m.body)}<span class="meta">${m.time} · ${scenarioShort(m.scenarioKey)}</span></div></div>`).join('')}</div>`
  } else {
    inner = `<div class="panel-body">${list.map((m, i) => `
      <div class="msg" style="border-bottom:${i < list.length - 1 ? '1px solid ' + divider : 'none'}">
        <div class="top"><b style="color:${primary}">${esc(m.subject || 'Hall Energy')}</b><span>${m.time}</span></div>
        <p style="color:${c.light ? 'rgba(26,26,26,.65)' : 'rgba(255,255,255,.7)'}">${esc(m.body)}</p>
        <p class="meta">${scenarioShort(m.scenarioKey)} · ${m.stepIndex + 1}</p>
      </div>`).join('')}</div>`
  }
  return `<section class="panel" style="background:${c.bg};border-color:${c.light ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.15)'}">${head}${inner}</section>`
}

function scenarioShort(key) {
  return { ev_journey: 'Elbilsresan', outage: 'Strömavbrott', price_compare: 'Riskzon', green_interest: 'Grönt', anon_smart: 'Anonym', anon_to_profile: 'Anonym → kund' }[key] || key
}

// ── Rendering: dev tools ──────────────────────────────────────────────────
function scenarioChangeSummary(scene) {
  const c = state.lastChange
  if (!c || c.scenarioKey !== scene.key) return ''
  return `<div class="scenario-change-row">
    <span class="scenario-change">Profil uppdaterad</span>
    ${renderChangeFacts(c)}
    <span class="scenario-decision"><b>NBO:</b> ${esc(c.decisionAfter?.nbo || 'inget')} · <b>NBA:</b> ${esc(c.decisionAfter?.nba || 'ingen')}</span>
    <button class="profile-change-link" data-nav="profile" data-scroll="profile-decision">Visa beslut →</button>
  </div>`
}

function renderScenarioBar() {
  const scene = activeScenario()
  if (!scene) {
    return `<div class="scenario-main"><span class="scenario-chip">SCENARIER</span>
      ${SCENARIOS.map((s) => `<button class="pill" data-start="${s.key}">${esc(s.title)}</button>`).join('')}
      <span class="spacer"></span>
      <button class="arch-link" data-action="open-architecture">🧩 Arkitektur</button>
    </div>`
  }
  const total = scene.steps.length
  const idx = state.active.stepIdx
  const done = idx >= total
  const step = !done ? scene.steps[idx] : null
  const lastNotes = idx > 0 ? scene.steps[idx - 1].notes : []
  return `<div class="scenario-main">
      <span class="scenario-chip">SCENARIER</span>
      <span class="scen-title">${esc(scene.title)} · ${Math.min(idx, total)}/${total}</span>
      ${idx > 0 ? `<button class="ghost-btn" data-action="prev-step">◀ back</button>` : ''}
      ${!done
        ? `<button class="step-btn" data-action="next-step">▶ ${esc(step.label)}</button>`
        : `<span style="color:#4ADE80;font-weight:700">Klart</span>`}
      <button class="icon-btn" data-action="exit-scenario" title="Avsluta scenariot">✕</button>
      <span class="spacer"></span>
      <button class="arch-link" data-action="open-architecture">🧩 Arkitektur</button>
    </div>
    ${scenarioChangeSummary(scene)}
    ${lastNotes.length ? `<p class="scenario-notes"><span class="check">✓</span> ${lastNotes.map(esc).join(' · ')}</p>` : ''}`
}

function renderPersonaBar() {
  const p = persona()
  const isAnon = state.anonymous
  const id = state.customerId || 'anon'
  const scores = scoresOf(id, isAnon)
  const segs = segmentsFor(id, isAnon)
  const products = isAnon ? [] : holdingsOf(id)
  const change = lastChangeFor(id)
  const d = decide()
  const display = isAnon ? 'Anonym besökare' : (p ? p.name : 'Ingen persona')
  const meta = p && !isAnon
    ? `${tariffLabel(p.tariff)} · ${p.usage.toLocaleString('sv-SE')} kWh/år · ${p.housing} · ${p.postcode}`
    : isAnon ? 'Endast cookie · inga profiluppgifter' : ''

  return `
    <div class="persona-row">
      <div class="persona-menu-wrap">
        <button class="persona-chip" data-action="toggle-persona-menu">${esc(isAnon ? 'Anonym' : (p ? p.name.split(' ')[0] : 'Välj'))} ▾</button>
        ${state.personaMenu ? `<div class="persona-menu">
          ${Object.values(PERSONAS).map((x) => `<button data-select="${x.id}">${esc(x.name)}<span>${tariffLabel(x.tariff)} · ${x.usage.toLocaleString('sv-SE')} kWh/år · ${x.housing}</span></button>`).join('')}
          <button data-select-anon>Anonym besökare<span>Endast cookie · inga profiluppgifter</span></button>
        </div>` : ''}
      </div>
      <span class="persona-name">${esc(display)}</span>
      ${meta ? `<span class="persona-meta">${esc(meta)}</span>` : ''}
      ${!isAnon ? `<button class="login-pill ${state.loggedIn && state.customerId ? 'on' : 'off'}" data-action="toggle-login">${state.loggedIn && state.customerId ? 'Logga ut' : 'Logga in'}</button>` : ''}
      <button class="profile-btn ${change ? 'changed' : ''}" data-nav="profile">Profil${change ? ' · uppdaterad' : ''}</button>
      <span class="spacer"></span>
      <span class="toggle-wrap">Personalisering <button class="toggle ${state.personalization ? '' : 'off'}" data-action="toggle-personalization" aria-label="Personalisering"></button> <b style="color:#EA1B0A">${state.personalization ? 'ON' : 'OFF'}</b></span>
      <button class="reset-btn" data-action="reset">Återställ</button>
    </div>
    <div class="persona-detail">
      <div>
        <div class="model-grid">
          ${model('EV', scores.ev, '#3B82F6', { delta: change?.scores?.ev })}
          ${model('Churn', scores.churn, '#EA1B0A', { delta: change?.scores?.churn })}
          ${model('Green', scores.green, '#22C55E', { delta: change?.scores?.green })}
          ${model('Solar', scores.solar, '#F59E0B', { delta: change?.scores?.solar })}
        </div>
      </div>
      <span class="spacer"></span>
      <div class="chips">${segs.map((s) => `<span class="chip ${change?.segmentsAdded?.includes(s) ? 'new' : ''}">${esc(s)}</span>`).join('')}</div>
      <div class="chips">${products.map((s) => `<span class="chip prod">${esc(s)}</span>`).join('')}</div>
    </div>
    ${renderPersonaPolicy(d, id, change)}`
}

function model(label, value, color, opts = {}) {
  const delta = opts.delta
  const diff = delta ? Math.round((delta.to - delta.from) * 100) : 0
  return `<div class="model ${delta ? 'changed' : ''}" ${delta ? `title="${pct(delta.from)} → ${pct(delta.to)}"` : ''}>
    <span style="width:44px">${label}</span>
    <span class="track"><span class="fill" style="width:${pct(value)};background:${color}"></span></span>
    <b>${pct(value)}</b>
    ${delta ? `<span class="model-delta">${diff >= 0 ? '+' : '−'}${Math.abs(diff)}</span>` : ''}
  </div>`
}

// ── Render root ───────────────────────────────────────────────────────────
function render(opts = {}) {
  const y = opts.keepScroll ? window.scrollY : 0
  document.getElementById('site').innerHTML = renderSite()
  document.getElementById('rail').innerHTML = renderRail()
  document.getElementById('scenarioBar').innerHTML = renderScenarioBar()
  document.getElementById('personaBar').innerHTML = renderPersonaBar()
  measure()
  window.requestAnimationFrame(() => { window.scrollTo(0, y) })
  if (opts.top) window.scrollTo(0, 0)
}

function measure() {
  const rail = document.getElementById('rail')
  const bar = document.getElementById('scenarioBar')
  if (window.innerWidth >= 1024) {
    const top = bar.getBoundingClientRect().top
    rail.style.height = Math.max(300, Math.round(top - 8)) + 'px'
  } else {
    rail.style.height = ''
  }
}

// ── Actions ───────────────────────────────────────────────────────────────
function startScenario(key) {
  const scene = SCENARIOS.find((s) => s.key === key)
  if (!scene) return
  state.active = { key, stepIdx: 0 }
  state.messages = state.messages.filter((m) => m.scenarioKey !== key)
  state.toast = null
  state.view = 'home'
  state.explain = false
  state.lastChange = null
  state.signalLog = {}
  state.personaMenu = false
  if (scene.anonymous) {
    state.anonymous = true
    state.loggedIn = false
    state.customerId = scene.persona || 'anon'
    state.scores[state.customerId] = { ...ZERO_SCORES }
    state.holdings[state.customerId] = []
    state.newsletter[state.customerId] = false
    state.outage = false
  } else if (scene.persona) {
    selectPersona(scene.persona, true)
    state.active = { key, stepIdx: 0 }
  }
  render({ top: true })
}

function applyStep() {
  const scene = activeScenario()
  if (!scene || !state.active) return
  const i = state.active.stepIdx
  const step = scene.steps[i]
  if (!step) return
  const a = step.apply || {}
  const before = snapshotState()

  if (a.anonymous) {
    state.anonymous = true
    state.loggedIn = false
  }
  if (a.identify) {
    state.anonymous = false
    state.customerId = a.identify
    state.loggedIn = true
    state.holdings[a.identify] = [...PERSONAS[a.identify].holdings]
  }
  if (typeof a.login === 'boolean') state.loggedIn = a.login
  if (typeof a.outage === 'boolean') state.outage = a.outage
  if (a.newsletter && state.customerId) state.newsletter[state.customerId] = true
  if (a.scores) {
    const id = state.customerId || 'anon'
    state.scores[id] = {
      ...(state.scores[id] || { ev: 0, churn: 0, green: 0, solar: 0 }),
      ...a.scores,
    }
  }
  if (a.holding && state.customerId) {
    if (!state.holdings[state.customerId].includes(a.holding)) {
      state.holdings[state.customerId] = [...state.holdings[state.customerId], a.holding]
    }
  }
  if (step.messages) {
    step.messages.forEach((m) => {
      const exists = state.messages.some((x) => x.scenarioKey === scene.key && x.stepIndex === i && x.channel === m.channel)
      if (!exists) {
        state.messages.push({
          customerId: state.customerId, scenarioKey: scene.key, stepIndex: i,
          channel: m.channel, subject: m.subject || null, body: m.body, time: nowTime(),
        })
      }
    })
    if (step.messages.some((m) => m.channel === 'inbox') && state.loggedIn && step.page !== 'inbox') {
      const first = persona() ? persona().name.split(' ')[0] + ', du' : 'Du'
      state.toast = `${first} har fått ett nytt meddelande i din inkorg.`
    }
  }
  addSignals(state.customerId || 'anon', step.signals, scene, i)
  const after = snapshotState()
  state.lastChange = diffState(before, after, scene, step, i)
  state.active.stepIdx = i + 1
  if (step.page && state.view !== 'profile') state.view = step.page
  render({ top: true })
}

function prevStep() {
  if (!state.active) return
  state.lastChange = null
  state.active.stepIdx = Math.max(0, state.active.stepIdx - 1)
  const scene = activeScenario()
  const prev = scene.steps[state.active.stepIdx - 1]
  if (prev && prev.page && state.view !== 'profile') state.view = prev.page
  render({ top: true })
}

function exitScenario() {
  state.active = null
  state.explain = false
  render()
}

function selectPersona(id, keepActive = false) {
  state.customerId = id
  state.anonymous = false
  state.loggedIn = true
  state.personaMenu = false
  state.scores[id] = { ...PERSONAS[id].scores }
  state.holdings[id] = [...PERSONAS[id].holdings]
  state.newsletter[id] = false
  state.outage = false
  state.lastChange = null
  state.signalLog[id] = []
  if (!keepActive) state.active = null
  state.view = 'home'
  state.explain = false
  if (!keepActive) render()
}

function resetAll() {
  state.view = 'home'
  state.customerId = 'eva'
  state.loggedIn = true
  state.anonymous = false
  state.personalization = true
  state.holdings = initialHoldings()
  state.scores = initialScores()
  state.newsletter = Object.fromEntries(Object.keys(PERSONAS).map((id) => [id, false]))
  state.outage = false
  state.active = null
  state.messages = []
  state.signalLog = {}
  state.lastChange = null
  state.personaMenu = false
  state.explain = false
  state.toast = null
  state.archScenario = 'all'
  state.archNode = null
  render({ top: true })
}

// ── Event delegation ──────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action],[data-nav],[data-start],[data-select],[data-select-anon],[data-arch-scenario],[data-arch-node],[data-arch-close]')
  if (!el) return

  if (el.dataset.start !== undefined) { startScenario(el.dataset.start); return }
  if (el.dataset.nav !== undefined) {
    e.preventDefault()
    state.view = el.dataset.nav
    state.personaMenu = false
    state.toast = null
    render({ top: true })
    if (el.dataset.scroll) {
      window.requestAnimationFrame(() => {
        const target = document.getElementById(el.dataset.scroll)
        if (target) target.scrollIntoView({ block: 'start', behavior: 'smooth' })
      })
    }
    return
  }
  if (el.dataset.select !== undefined) { selectPersona(el.dataset.select); return }
  if (el.dataset.archScenario !== undefined) {
    state.archScenario = el.dataset.archScenario
    state.archNode = null
    state.view = 'architecture'
    state.personaMenu = false
    render({ keepScroll: true })
    return
  }
  if (el.dataset.archNode !== undefined) {
    state.archNode = state.archNode === el.dataset.archNode ? null : el.dataset.archNode
    render({ keepScroll: true })
    if (state.archNode) {
      window.requestAnimationFrame(() => {
        const info = document.querySelector('.arch-nodeinfo')
        if (info) info.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
      })
    }
    return
  }
  if (el.dataset.archClose !== undefined) {
    state.archNode = null
    render({ keepScroll: true })
    return
  }
  if (el.dataset.selectAnon !== undefined) {
    state.anonymous = true
    state.customerId = null
    state.loggedIn = false
    state.personaMenu = false
    state.active = null
    state.view = 'home'
    state.lastChange = null
    state.signalLog = {}
    state.outage = false
    render({ top: true })
    return
  }

  switch (el.dataset.action) {
    case 'toggle-persona-menu': state.personaMenu = !state.personaMenu; render({ keepScroll: true }); break
    case 'toggle-login':
      if (state.anonymous) return
      state.loggedIn = !state.loggedIn
      render({ keepScroll: true })
      break
    case 'toggle-personalization': state.personalization = !state.personalization; render({ keepScroll: true }); break
    case 'toggle-explain': state.explain = !state.explain; render({ keepScroll: true }); break
    case 'next-step': applyStep(); break
    case 'prev-step': prevStep(); break
    case 'exit-scenario': exitScenario(); break
    case 'open-architecture':
      state.view = 'architecture'
      state.archScenario = state.active ? state.active.key : 'all'
      state.archNode = null
      state.toast = null
      state.personaMenu = false
      render({ top: true })
      break
    case 'dismiss-toast': state.toast = null; render({ keepScroll: true }); break
    case 'reset': resetAll(); break
    case 'nba-cta': {
      if (el.dataset.url) { state.view = el.dataset.url; render({ top: true }) }
      break
    }
  }
})

window.addEventListener('resize', measure)
window.addEventListener('scroll', () => { /* fixed bars; rail stays put */ }, { passive: true })

// ── Boot ──────────────────────────────────────────────────────────────────
render({ top: true })
</script>
</body>
</html>
